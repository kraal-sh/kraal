name: CI

# Linux on every push and pull request. macOS on pull requests, tags, and when asked for (Actions,
# Run workflow); a push to main was already tested in its pull request.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  macos:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      # Every failure reported, not only the first test binary's.
      - run: cargo test --no-fail-fast
