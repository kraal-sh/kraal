# Which account an agent starts on, by workspace or directory, and what happens at its limit.
# Add these tables to ~/.config/kraal/accounts.toml with `kraal accounts edit`.
# That file also holds [[account]] entries, written by `kraal accounts add claude work`.
# Needs the names in `kraal accounts`: a verified existing sign-in is named Personal unless
# the agent supplies a public identity. Rename it or adjust these rules to its actual name.
# A rule skips accounts that are not listed.

[limits]
threshold = 85                  # percent of the 5-hour or weekly window: the account is full
mode = "ask"                    # "notify" tells you, "ask" offers, "auto" checks before moving
# Changes need known usage below the threshold and verified sign-in. Unknown usage is not zero.
# Notify messages include Change account; choosing it opens the affected pane's picker.
# A successful change offers Undo, also kept in the pane's actions.
# A failed automatic change waits for a manual retry or a new crossing of the threshold.

# Names can also be written as agent:name. On rewriting, kraal binds known accounts to internal
# identities so a rename or reused name does not change what a rule allows. Keep generated references.

# The first rule that matches decides. In the workspace "shop", every agent starts on its
# work account, and on your own when it has none or that one is over the threshold.
[[rule]]
workspace = "shop"
accounts = ["work", "Personal"]

# In this directory and below it (its worktrees count), Claude only uses your own account.
[[rule]]
path = "~/src/personal"
agent = "claude"
accounts = ["Personal"]

# kraal keeps one [[account]] per account after review. Former names, identities and homes
# are fields under [[account.references]], not extra accounts. Keep these generated fields.
# References with no remaining account are kept under [[forgotten]] to prevent rediscovery.
