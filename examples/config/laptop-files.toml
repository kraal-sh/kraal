# Choose which laptop directories a remote file manager can browse and transfer to or from.
# Needs ssh access to a session through kraal attach --host.
# Deleting, moving away or replacing laptop items always asks locally, even with Always.
# Put this in config.toml on the laptop. Permission is still asked locally.
[laptop_files]
# "home" excludes hidden top-level entries and ~/Library on macOS.
# "all" allows directories anywhere your user can access. "off" refuses listing and copying.
scope = "home"
